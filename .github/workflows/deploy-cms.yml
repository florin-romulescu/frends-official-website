name: Deploy CMS

on:
  push:
    branches: [main]
    paths:
      - wordpress/**
      - .github/workflows/deploy-cms.yml
  workflow_dispatch:

concurrency:
  group: deploy-cms
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: find wordpress -name '*.php' -print0 | xargs -0 -n1 php -l

      - run: find wordpress -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - run: docker compose -f wordpress/docker-compose.yml --env-file wordpress/.env.example --profile prod config -q

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Require settings
        run: |
          test -n "${{ vars.CMS_HOST }}" || { echo "repository variable CMS_HOST is not set"; exit 1; }
          test -n "${{ secrets.CMS_SSH_KEY }}" || { echo "secret CMS_SSH_KEY is not set"; exit 1; }
          test -n "${{ secrets.CMS_SSH_KNOWN_HOSTS }}" || { echo "secret CMS_SSH_KNOWN_HOSTS is not set"; exit 1; }

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CMS_SSH_KEY }}" > ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.CMS_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Sync wordpress/
        run: |
          rsync -rlpz --checksum --delete --itemize-changes \
            --exclude .env --exclude backup/.env.backup \
            wordpress/ "root@${{ vars.CMS_HOST }}:/opt/frends-website/wordpress/" | tee changes.txt

      - name: Apply on the server
        run: ssh "root@${{ vars.CMS_HOST }}" /opt/frends-website/wordpress/deploy.sh < changes.txt
