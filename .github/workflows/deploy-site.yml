name: Deploy site

on:
  push:
    branches: [main]
    paths-ignore:
      - wordpress/**
      - .github/workflows/deploy-cms.yml
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

env:
  WP_API_URL: https://cms.frends.ro

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Require settings
        run: |
          test -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" || { echo "secret CLOUDFLARE_API_TOKEN is not set"; exit 1; }
          test -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" || { echo "secret CLOUDFLARE_ACCOUNT_ID is not set"; exit 1; }

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=frends-website --branch=main --commit-dirty=true
