name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Typecheck, build, and enforce the JS budget. The budget check is the
      # guard against a stray `client:*` directive quietly putting the React
      # runtime on every page.
      - run: pnpm verify
