name: frends-cms

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:7.0-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:${WP_LOCAL_PORT:-8080}:80'
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: frends_
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${WP_HOME}');
        define('WP_SITEURL', '${WP_HOME}');
        define('FRENDS_SITE_URL', '${ASTRO_SITE_URL}');
        define('FRENDS_BUILD_HOOK_URL', '${BUILD_HOOK_URL}');
        define('DISALLOW_FILE_EDIT', true);
        define('WP_AUTO_UPDATE_CORE', 'minor');
        define('WP_POST_REVISIONS', 10);
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
          $$_SERVER['HTTPS'] = 'on';
        }
    volumes:
      - wp_data:/var/www/html
      - ./themes/frends-headless:/var/www/html/wp-content/themes/frends-headless
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro

  wpcli:
    image: wordpress:cli-php8.3
    profiles: [tools]
    user: '33:33'
    depends_on:
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: frends_
    volumes:
      - wp_data:/var/www/html
      - ./themes/frends-headless:/var/www/html/wp-content/themes/frends-headless
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins

  caddy:
    image: caddy:2.9
    profiles: [prod]
    restart: unless-stopped
    depends_on:
      - wordpress
    ports:
      - '80:80'
      - '443:443'
    environment:
      CMS_DOMAIN: ${CMS_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  wp_data:
  caddy_data:
  caddy_config:
